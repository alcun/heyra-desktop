[package]
name = "heyra"
version = "0.1.0"
edition = "2024"

[dependencies]
arboard = "3.6.1"
bzip2 = "0.6.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
core-foundation = "=0.10.0"
core-graphics = "0.24"
cpal = "0.18.2"
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
hound = "3.5.1"
objc = "0.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
sherpa-rs = { version = "0.6.8", default-features = false, features = ["download-binaries", "static"] }
tar = "0.4.46"
tray-icon = "0.26.0"
ureq = "3"
