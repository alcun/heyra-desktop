[package]
name = "heyra"
version = "0.3.8"
edition = "2024"
description = "Hold fn, talk, let go: local push-to-talk dictation for macOS"
license = "MIT"
repository = "https://github.com/alcun/heyra-desktop"

[dependencies]
arboard = "3.6.1"
block = "0.1.6"
bzip2 = "0.6.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
cocoa = "0.26"
core-foundation = "=0.10.0"
core-graphics = "0.24"
core-graphics-types = "=0.1.3"
cpal = "0.18.2"
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
hound = "3.5.1"
image = { version = "0.25", default-features = false, features = ["png"] }
metal = "0.29"
objc = "0.2"
raw-window-handle = "0.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
sherpa-rs = { version = "0.6.8", default-features = false, features = ["download-binaries", "static"] }
tar = "0.4.46"
tray-icon = "0.26.0"
ureq = "3"
